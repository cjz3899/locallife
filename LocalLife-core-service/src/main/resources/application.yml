server:
  port: 8080
spring:
  application:
    name: LocalLife
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere.yaml
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      password: cjz20060820
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      #默认的消费组ID
      group-id: create_voucher_order
      #是否自动提交offset - 改为自动提交
      # enable-auto-commit: true
      #改为手动提交
      enable-auto-commit: false
    listener:
      #提交offset延时
      auto-commit-interval: 200
      # 当kafka中没有初始offset或offset超出范围时将自动重置offset
      # earliest:重置为分区中最小的offset;
      # latest:重置为分区中最新的offset(消费分区中新产生的数据);
      # none:只要有一个分区不存在已提交的offset,就抛出异常;
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      #手动立即提交：只有显示调用acknowledge()方法时才提交
      ack-mode: manual_immediate
mybatis-plus:
  type-aliases-package: com.junzhecai.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
logging:
  level:
    com.junzhecai: info
    AUDIT: INFO
  pattern:
    dateformat: mm:ss.SSS
bloom-filter:
  filters:
    shop:
      name: shop-id-bloom
      expected-insertions: 50000
      false-probability: 0.01
    voucher:
      name: voucher-id-bloom
      expected-insertions: 100000
      false-probability: 0.01
app:
  # 图片上传存储目录（需与 nginx 的 /imgs alias 指向同一目录）
  upload-dir: /Users/caijunzhe/Desktop/LocalLife/upload/imgs

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    prometheus:
      enabled: true

seckill:
  reminder:
    ahead:
      seconds: 120
    # 去重窗口：同一用户在该时间范围内不重复提醒（秒）
    dedup:
      window:
        seconds: 1800
    notify:
      sms:
        enabled: false
        # 短信提醒接收号码，多个用逗号分隔
        to: ""
      app:
        enabled: false
      # 优惠券未设置allowedLevels/minLevel时的默认最小会员等级
      default:
        minLevel: 1
      # 每次提醒的最大用户数量，防止一次性通知过多
      max:
        users: 1000
      # 是否附加通知"最近购买活跃用户"
      top:
        buyers:
          enabled: true
          # 统计最近多少天的购买行为
          days: 30
          # Top购买用户数量
          count: 200
      user:
        # 最大会员等级
        level:
          max: 10
